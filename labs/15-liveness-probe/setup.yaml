apiVersion: v1
kind: Namespace
metadata:
  name: ckad-probe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ckad-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
