apiVersion: v1
kind: Namespace
metadata:
  name: ckad-nodeport
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ckad-nodeport
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80

